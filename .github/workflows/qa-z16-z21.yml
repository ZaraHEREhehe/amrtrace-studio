name: Isolated Z16 and Z21 Browser QA
on:
  push:
    branches:
      - qa/Z16-Z21-browser-smoke

permissions:
  contents: read

jobs:
  browser-qa:
    name: Real browser smoke QA (mocked API)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated Chromium testing tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Browser UI checks (no database writes)
        run: python web/tests/browser_smoke.py

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z16-z21-browser-smoke
          path: artifacts/browser-qa
          if-no-files-found: warn
          retention-days: 7
