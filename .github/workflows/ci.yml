name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Ruff correctness lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.10

      - name: Run correctness-focused Ruff checks
        run: ruff check src tests scripts --select E9,F63,F7,F82


  genericity:
    name: Genericity guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install guard test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1
          "psycopg[binary]==3.3.6"

      - name: Check generic engine packages
        run: python scripts/check_genericity.py

      - name: Prove deliberate violations are rejected
        run: python -m pytest tests/unit/test_genericity_guard.py -q



  web-tests:
    name: Web UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run dependency-free web tests
        run: node --test web/tests/*.test.mjs


  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file docker/Dockerfile.api --tag amrtrace-api:ci .

      - name: Build web image
        run: docker build --file docker/Dockerfile.web --tag amrtrace-web:ci .

      - name: Smoke-test web and API proxy
        run: |
          docker network create amrtrace-ci
          docker run -d --rm             --name amrtrace-api-ci             --network amrtrace-ci             --network-alias api             amrtrace-api:ci
          docker run -d --rm             --name amrtrace-web-ci             --network amrtrace-ci             -p 8080:80             amrtrace-web:ci

          for attempt in {1..20}; do
            if curl --fail --silent               http://127.0.0.1:8080/api/health               > /tmp/amrtrace-health.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent             http://127.0.0.1:8080/             | grep -q "AMRTrace Studio"

          python - <<'PY'
          import json

          with open(
              "/tmp/amrtrace-health.json",
              encoding="utf-8",
          ) as handle:
              payload = json.load(handle)

          assert payload == {
              "service": "api",
              "status": "ok",
          }, payload

          print("Web -> API proxy smoke test passed")
          PY


  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AMRTRACE_PG_HOST: localhost
      AMRTRACE_PG_PORT: "5432"
      AMRTRACE_PG_USER: postgres
      AMRTRACE_PG_PASSWORD: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -r requirements-api-test.txt

      - name: Verify PostgreSQL service
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(
              host=os.environ["AMRTRACE_PG_HOST"],
              port=os.environ["AMRTRACE_PG_PORT"],
              user=os.environ["AMRTRACE_PG_USER"],
              password=os.environ["AMRTRACE_PG_PASSWORD"],
              dbname="postgres",
              connect_timeout=5,
          ) as conn:
              assert conn.execute("SELECT 1").fetchone()[0] == 1

          print("PostgreSQL service reachable")
          PY

      - name: Run API integration tests
        run: pytest tests/integration/test_api_read.py tests/integration/test_api_changes.py tests/integration/test_api_reevaluation.py -q --maxfail=1

  unit-tests:
    name: Unit tests with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AMRTRACE_PG_HOST: localhost
      AMRTRACE_PG_PORT: "5432"
      AMRTRACE_PG_USER: postgres
      AMRTRACE_PG_PASSWORD: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check pytest-cov==7.1.0

      - name: Verify PostgreSQL service
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(
              host=os.environ["AMRTRACE_PG_HOST"],
              port=os.environ["AMRTRACE_PG_PORT"],
              user=os.environ["AMRTRACE_PG_USER"],
              password=os.environ["AMRTRACE_PG_PASSWORD"],
              dbname="postgres",
              connect_timeout=5,
          ) as conn:
              value = conn.execute("SELECT 1").fetchone()[0]
              assert value == 1

          print("PostgreSQL service reachable")
          PY

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            --cov=amrtrace \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z-05-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
