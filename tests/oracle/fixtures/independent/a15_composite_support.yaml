    - {case: CO_D_HALF_EDITED, kind: composite, group: TRIMETHOPRIM, need: 1, node_type: genotype_evidence, node_id: GEN_CO_D_T, member: DET_TMP}
    - {case: CO_D_HALF_EDITED, kind: composite, group: SULFONAMIDE, need: 1, node_type: genotype_evidence, node_id: GEN_CO_D_S, member: DET_SUL}
    - {case: CO_E_UNTOUCHED, kind: composite, group: TRIMETHOPRIM, need: 1, node_type: genotype_evidence, node_id: GEN_CO_E_T, member: DET_TMP}
    - {case: CO_E_UNTOUCHED, kind: composite, group: SULFONAMIDE, need: 1, node_type: genotype_evidence, node_id: GEN_CO_E_S, member: DET_SUL}
change_event:
  change_id: CHG-I22-COMPOSITE
  type: GENOTYPE_CHANGED
  old_version: EVIDENCE_V1
  new_version: EVIDENCE_V2
  changed_entities:
