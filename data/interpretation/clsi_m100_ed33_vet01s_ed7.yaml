# CLSI M100 Ed33 (2023) general rules plus CLSI VET01S Ed7 (2024) host rules, applied to Escherichia coli.
# Host rules: the VET01S species row where one exists (dog gentamicin), otherwise the VET01S grey human row
# (VET01S general comment 2). VET01S has no breakpoint for ceftriaxone (not listed) or ciprofloxacin (footnote c),
# so those drugs have no host rule. MIC in ug/mL; TMP-SMX compares the trimethoprim part only. Data, not code.
interpretation_version: CLSI_M100_ED33_VET01S_ED7
standard: CLSI
rules:
  - organism: Escherichia coli
    antibiotic: ceftriaxone
    method: MIC
    source: CLSI M100 Ed33 (2023) Table 2A
    breakpoint_species: human
    categories:
      - {label: susceptible, op: "<=", value: 1}
      - {label: intermediate, op: "==", value: 2}
      - {label: resistant, op: ">=", value: 4}
  - organism: Escherichia coli
    antibiotic: ciprofloxacin
    method: MIC
    source: CLSI M100 Ed33 (2023) Table 2A
    breakpoint_species: human
    categories:
      - {label: susceptible, op: "<=", value: 0.25}
      - {label: intermediate, op: "==", value: 0.5}
      - {label: resistant, op: ">=", value: 1}
  - organism: Escherichia coli
    antibiotic: gentamicin
    method: MIC
    source: CLSI M100 Ed33 (2023) Table 2A
    breakpoint_species: human
    categories:
      - {label: susceptible, op: "<=", value: 2}
      - {label: intermediate, op: "==", value: 4}
      - {label: resistant, op: ">=", value: 8}
  - organism: Escherichia coli
