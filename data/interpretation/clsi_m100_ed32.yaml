# CLSI M100 edition 32, gentamicin breakpoints for Enterobacterales, applied to Escherichia coli.
# Source: CLSI M100 (project references [13] and [14]). MIC in ug/mL. Data, not code.
interpretation_version: CLSI_M100_ED32
standard: CLSI
rules:
  - organism: Escherichia coli
    antibiotic: gentamicin
    method: MIC
    categories:
      - {label: susceptible, op: "<=", value: 4}
      - {label: intermediate, op: "==", value: 8}
      - {label: resistant, op: ">=", value: 16}
