# Isolated Z-28 demo validation. No production credentials or external datasets.
# This workflow is new; the existing eight-job CI workflow remains untouched.
name: Z-28 isolated demo smoke

on:
  pull_request:
    paths:
      - '.github/workflows/z28-demo.yml'
      - 'deploy/demo/**'
      - 'scripts/z28_demo_seed.py'
      - 'scripts/make_fixture.py'
      - 'tests/fixtures/mini_cohort/**'
      - 'tests/unit/test_z28_demo_seed.py'
      - 'db/migrations/**'
      - 'requirements-api.txt'
      - 'requirements-dev.txt'
      - 'src/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-smoke:
    name: Demo images, R1 seed, repeat start and reset
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 PyYAML==6.0.3 "psycopg[binary]==3.3.6"

      - name: Set demo-only identity and random password
        shell: bash
        run: |
          echo "Z28_IMAGE_TAG=git-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "Z28_DB_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "Z28_WEB_PORT=18080" >> "$GITHUB_ENV"
          echo "Z28_API_PORT=18000" >> "$GITHUB_ENV"

      - name: Validate demo guard tests
        run: python -m pytest -q tests/unit/test_z28_demo_seed.py

      - name: Build demo-only images from pinned bases
        run: |
          docker build -f deploy/demo/Dockerfile.api -t "amrtrace-z28-demo-api:${Z28_IMAGE_TAG}" .
          docker build -f deploy/demo/Dockerfile.web -t "amrtrace-z28-demo-web:${Z28_IMAGE_TAG}" .

      - name: Start isolated demo and wait for healthy services
        run: docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml up -d --wait --wait-timeout 450

      - name: Check baseline, API, web, and configured model keys
        shell: bash
        run: |
          set -euo pipefail
          case_count=$(docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml exec -T db psql -U postgres -d amrtrace_z28 -Atqc 'SELECT count(*) FROM "case"')
          state_count=$(docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml exec -T db psql -U postgres -d amrtrace_z28 -Atqc "SELECT count(*) FROM case_state WHERE release_id='R1'")
          r1_status=$(docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml exec -T db psql -U postgres -d amrtrace_z28 -Atqc "SELECT status FROM release WHERE release_id='R1'")
          test "$case_count" = '660'
          test "$state_count" = '660'
          test "$r1_status" = 'PUBLISHED'
          curl -fsS http://127.0.0.1:18080/api/health | python -c "import sys,json; data=json.load(sys.stdin); assert data=={'service':'api','status':'ok'}"
          curl -fsS http://127.0.0.1:18080/ | grep -qi 'AMRTrace'
          docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml exec -T api python -c "import os; names=['GROQ_API_KEY','AMRTRACE_COPILOT_LOCAL_URL','AMRTRACE_COPILOT_LOCAL_MODEL','AMRTRACE_COPILOT_HOSTED_MODEL']; assert all(not os.environ.get(n) for n in names)"
          echo 'Z28_DOCKER_FIRST_START_SUCCESS'

      - name: Validate repeated start without duplicate seed
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml up -d --wait --wait-timeout 450 --no-build --pull never
          [ "$(docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml exec -T db psql -U postgres -d amrtrace_z28 -Atqc 'SELECT count(*) FROM "case"')" = '660' ]
          echo 'Z28_DOCKER_REPEAT_SUCCESS'

      - name: Validate isolated reset and re-seeding from cached images
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml down --volumes
          docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml up -d --wait --wait-timeout 450 --no-build --pull never
          [ "$(docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml exec -T db psql -U postgres -d amrtrace_z28 -Atqc 'SELECT count(*) FROM "case"')" = '660' ]
          [ "$(docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml exec -T db psql -U postgres -d amrtrace_z28 -Atqc "SELECT status FROM release WHERE release_id='R1'")" = 'PUBLISHED' ]
          echo 'Z28_DOCKER_RESET_SUCCESS'

      - name: Show isolated logs if something failed
        if: failure()
        run: docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml ps -a && docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml logs --tail=120

      - name: Shut down isolated containers and volume
        if: always()
        run: docker compose -p amrtrace-z28-demo -f deploy/demo/compose.yml down --volumes || true
