    - {node_type: genotype_evidence, node_id: GEN_CO_B_Q2, old_version: EVIDENCE_V1, new_version: null}
    - {node_type: genotype_evidence, node_id: GEN_CO_C_Q3, old_version: EVIDENCE_V1, new_version: null}
    - {node_type: genotype_evidence, node_id: GEN_CO_D_S, old_version: EVIDENCE_V1, new_version: EVIDENCE_V2}
expected:
