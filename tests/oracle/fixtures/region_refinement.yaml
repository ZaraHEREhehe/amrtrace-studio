scenario: REGION
description: >
  Synthetic stand-in for the real interpretation-table change (CLSI-REAL), with invented names. The changed region
  is MIC 2 to 4 and 8 to 16 (closed intervals). A case is selected if the values its measurement allows overlap
  the region: exact values inside it, censored values whose range reaches into it, and cases whose edge does not
  say where the measurement sits (unsure means keep). Everything else is left alone. '>16' and '<2' do not reach a
  closed interval ending at 16 or starting at 2; '>=16' and '<=4' do.
authored_by: insharah
authored_on_base_commit: b6c9e1b38eea2e67e870549aba11427391c9ce48      # filled by stamp_fixtures.py with the commit this file was written on top of
author_note: >
  Expected sets are written from plan section 6 and the over-selection principle (rule 6), not produced by running the selector.
  The author had read the A-05 selector source before writing; no expected set was changed to fit it.
