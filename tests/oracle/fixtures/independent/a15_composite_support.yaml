    - {case: CO_A_COMBINATION_HALF_LOST, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_A_S}
    - {case: CO_B_NEED_TWO_BROKEN, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_B_G}
    - {case: CO_B_NEED_TWO_BROKEN, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_B_Q1}
    - {case: CO_B_NEED_TWO_BROKEN, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_B_Q2}
    - {case: CO_C_NEED_TWO_WITH_SPARE, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_C_G}
    - {case: CO_C_NEED_TWO_WITH_SPARE, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_C_Q1}
    - {case: CO_C_NEED_TWO_WITH_SPARE, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_C_Q2}
    - {case: CO_C_NEED_TWO_WITH_SPARE, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_C_Q3}
    - {case: CO_D_HALF_EDITED, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_D_T}
    - {case: CO_D_HALF_EDITED, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_D_S}
    - {case: CO_E_UNTOUCHED, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_E_T}
    - {case: CO_E_UNTOUCHED, dep_type: positive_support, edge_type: derived_from, node_type: genotype_evidence, node_id: GEN_CO_E_S}
  support:
    - {case: CO_A_COMBINATION_HALF_LOST, kind: composite, group: TRIMETHOPRIM, need: 1, node_type: genotype_evidence, node_id: GEN_CO_A_T, member: DET_TMP}
    - {case: CO_A_COMBINATION_HALF_LOST, kind: composite, group: SULFONAMIDE, need: 1, node_type: genotype_evidence, node_id: GEN_CO_A_S, member: DET_SUL}
    - {case: CO_B_NEED_TWO_BROKEN, kind: composite, group: GYRA, need: 1, node_type: genotype_evidence, node_id: GEN_CO_B_G, member: MUT_G}
    - {case: CO_B_NEED_TWO_BROKEN, kind: composite, group: QRDR, need: 2, node_type: genotype_evidence, node_id: GEN_CO_B_Q1, member: MUT_Q1}
    - {case: CO_B_NEED_TWO_BROKEN, kind: composite, group: QRDR, need: 2, node_type: genotype_evidence, node_id: GEN_CO_B_Q2, member: MUT_Q2}
    - {case: CO_C_NEED_TWO_WITH_SPARE, kind: composite, group: GYRA, need: 1, node_type: genotype_evidence, node_id: GEN_CO_C_G, member: MUT_G}
