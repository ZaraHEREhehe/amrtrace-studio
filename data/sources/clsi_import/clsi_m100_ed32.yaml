# import spec for CLSI_M100_ED32: which rows of the AMR clinical_breakpoints data stand in for this table (A-23).
# The guideline labels are years; the year to edition mapping below is our assumption, not confirmed upstream.
# No breakpoint values here: they are read from a local snapshot and written only to a draft.
interpretation_version: CLSI_M100_ED32
standard: CLSI
organism: Escherichia coli
# species row first, then the Enterobacterales group row
organism_codes: [B_ESCHR_COLI, "B_[ORD]_ENTRBCTR"]
human_guideline: "CLSI 2022"   # assumed M100 Ed32
drugs:
  ceftriaxone: CRO
  ciprofloxacin: CIP
  gentamicin: GEN
  meropenem: MEM
  trimethoprim-sulfamethoxazole: SXT
