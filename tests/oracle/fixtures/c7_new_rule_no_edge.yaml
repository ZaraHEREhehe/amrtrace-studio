scenario: C7
description: >
  The novelty. A brand-new rule connects a determinant to a drug that no earlier rule covered, so no case has any
  stored edge to it (the edge could not exist before the rule did). The affected cases are exactly those whose
  recorded rule space includes that determinant-drug pair (applicability records). A selector that only follows
  realised edges finds nothing here. Same determinant for another drug, other determinants and cases without a
  record are not affected.
authored_by: insharah
authored_on_base_commit: b6c9e1b38eea2e67e870549aba11427391c9ce48      # filled by stamp_fixtures.py with the commit this file was written on top of
author_note: >
  Expected sets are written from plan section 6 and the over-selection principle (rule 6), not produced by running the selector.
  The author had read the A-05 selector source before writing; no expected set was changed to fit it.
pending:
  until: A-06
  reason: applicability-based selection is not implemented yet (A-05 follows realised edges only)
