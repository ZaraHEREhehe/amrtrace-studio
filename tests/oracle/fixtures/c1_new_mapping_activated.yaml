scenario: C1
description: >
  A determinant-to-drug mapping is activated: an old rule that said "no mapping" for the pair is replaced by a new
  rule that maps it. Cases carrying that determinant for that drug are affected. They have a stored edge to the old
  rule, so even a selector that only follows realised edges finds them (contrast with C7). The same determinant for
  another drug, and other determinants, are not affected.
authored_by: insharah
authored_on_base_commit: b6c9e1b38eea2e67e870549aba11427391c9ce48      # filled by stamp_fixtures.py with the commit this file was written on top of
author_note: >
  Expected sets are written from plan section 6 and the over-selection principle (rule 6), not produced by running the selector.
  The author had read the A-05 selector source before writing; no expected set was changed to fit it.
world:
  cases: [C1_A_DET1_GENT, C1_B_DET1_GENT, C1_C_DET1_MERO, C1_D_DET2_GENT, C1_E_NO_EDGES]
  versions:
    - {node_type: mapping_rule, node_id: MAPRULE_DET1_GENT_OLD, version: MAPPING_SET_V1}
    - {node_type: mapping_rule, node_id: MAPRULE_DET1_GENT_NEW, version: MAPPING_SET_V2}
  mapping_rules:
    - {mapping_rule_id: MAPRULE_DET1_GENT_OLD, mapping_version: MAPPING_SET_V1, determinant_identity: DET1, candidate_antibiotic: gentamicin}
    - {mapping_rule_id: MAPRULE_DET1_GENT_NEW, mapping_version: MAPPING_SET_V2, determinant_identity: DET1, candidate_antibiotic: gentamicin}
  edges:
    - {case: C1_A_DET1_GENT, dep_type: applicability, edge_type: evaluated_against, node_type: mapping_rule, node_id: MAPRULE_DET1_GENT_OLD, node_version: MAPPING_SET_V1}
    - {case: C1_B_DET1_GENT, dep_type: applicability, edge_type: evaluated_against, node_type: mapping_rule, node_id: MAPRULE_DET1_GENT_OLD, node_version: MAPPING_SET_V1}
    - {case: C1_C_DET1_MERO, dep_type: applicability, edge_type: evaluated_against, node_type: mapping_rule, node_id: MAPRULE_DET1_MERO_OLD, node_version: MAPPING_SET_V1}
    - {case: C1_D_DET2_GENT, dep_type: applicability, edge_type: evaluated_against, node_type: mapping_rule, node_id: MAPRULE_DET2_GENT_OLD, node_version: MAPPING_SET_V1}
  applicability:
    - {case: C1_A_DET1_GENT, determinant_identity: DET1, candidate_antibiotic: gentamicin}
    - {case: C1_B_DET1_GENT, determinant_identity: DET1, candidate_antibiotic: gentamicin}
    - {case: C1_C_DET1_MERO, determinant_identity: DET1, candidate_antibiotic: meropenem}
    - {case: C1_D_DET2_GENT, determinant_identity: DET2, candidate_antibiotic: gentamicin}
change_event:
  change_id: CHG-ORACLE-C1
  type: MAPPING_ADDED
  old_version: MAPPING_SET_V1
  new_version: MAPPING_SET_V2
  changed_entities:
    - {node_type: mapping_rule, node_id: MAPRULE_DET1_GENT_OLD, old_version: MAPPING_SET_V1, new_version: null}
    - {node_type: mapping_rule, node_id: MAPRULE_DET1_GENT_NEW, old_version: null, new_version: MAPPING_SET_V2}
expected:
  required_case_ids: [C1_A_DET1_GENT, C1_B_DET1_GENT]
  allowed_extra_case_ids: []
  must_not_select_case_ids: [C1_C_DET1_MERO, C1_D_DET2_GENT, C1_E_NO_EDGES]
