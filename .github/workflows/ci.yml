name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Ruff correctness lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.10

      - name: Run correctness-focused Ruff checks
        run: ruff check src tests scripts --select E9,F63,F7,F82

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file docker/Dockerfile.api --tag amrtrace-api:ci .

      - name: Build web image
        run: docker build --file docker/Dockerfile.web --tag amrtrace-web:ci .
