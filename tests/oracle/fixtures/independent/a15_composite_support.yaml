  allowed_extra_case_ids: []
  must_not_select_case_ids: [CO_E_UNTOUCHED]
  expected_annotations:
    CO_A_COMBINATION_HALF_LOST: support_may_fall
    CO_B_NEED_TWO_BROKEN: support_may_fall
    CO_C_NEED_TWO_WITH_SPARE: alternative_support_holds
    CO_D_HALF_EDITED: null
